name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Pages needs these to publish. Read-only by default, so they are opt-in.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a running one — a half-finished deploy
# is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first version to fail cancels the others and you get
      # three red jobs hiding one real error.
      fail-fast: false
      matrix:
        # vitest 4 needs ^20 || >=22, and package.json declares >=20.19.
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # The project lives in app/, so the lockfile is not at the repo root.
          # This is what the first run failed on.
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    # Only publish from main, and only if the tests actually passed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          # Derived from the repo name, so renaming the repo does not silently
          # break every asset path.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
